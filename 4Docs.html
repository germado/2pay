<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>4Docs Tool</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f8fafc;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* CENTER CARD */
.card{
  width:340px;
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
  text-align:center;
}

/* INPUTS */
input, select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* MAIN BUTTON */
.main-btn{
  width:100%;
  padding:14px;
  background:#84cc16;
  color:white;
  border:none;
  border-radius:25px;
  margin-top:10px;
  cursor:pointer;
}

/* WALLET COPY */
.wallet{
  font-size:12px;
  margin-top:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
}

.copy{
  cursor:pointer;
  font-size:14px;
  color:#84cc16;
}

/* PRICE */
.price{
  margin-top:10px;
  font-weight:bold;
  font-size:16px;
}

/* BOTTOM ACTIONS */
.bottom-actions{
  position:fixed;
  bottom:20px;
  display:flex;
  gap:10px;
}

/* BUTTONS */
.logout{
  padding:10px 20px;
  background:#ef4444;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

.whatsapp{
  padding:10px 18px;
  background:#25D366;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  text-align:center;
  font-size:12px;
  padding:8px;
}

input, select, button {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="card">

  <h3>PayPal Payment</h3>

  <input placeholder="PayPal Email">
  <input placeholder="Product Name">
  <input placeholder="Price">

  <select>
    <option>USD - US Dollar</option>
  </select>

  <!-- PRICE ABOVE BUTTON -->
  <div class="price">Only $12/month</div>

  <button class="main-btn">Buy Now</button>

  <!-- WALLET COPY -->
  <div class="wallet">
    YOUR_WALLET_ADDRESS
    <span class="copy" onclick="copyWallet()">📋</span>
  </div>

</div>

<!-- BOTTOM BUTTONS -->
<div class="bottom-actions">
  <button class="logout" onclick="logout()">Logout</button>
  <button class="whatsapp" onclick="contact()">WhatsApp</button>
</div>

<div class="footer">
  © 2026 DraQing • All rights reserved
</div>

<script>
function logout(){
  window.parent.logout();
}

function contact(){
  window.open("https://wa.me/44XXXXXX");
}

function copyWallet(){
  navigator.clipboard.writeText("YOUR_WALLET_ADDRESS");
  alert("Wallet copied!");
}
</script>

</body>
</html>

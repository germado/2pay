<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Tool</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* GLOBAL INPUT FIX */
input, select, button {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

/* CARD */
.card{
  width:340px;
  background:#fff;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
}

/* BUTTON */
button{
  padding:14px;
  border:none;
  border-radius:25px;
  background:#16a34a;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

/* INPUT */
input{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* WHATSAPP */
.whatsapp{
  background:#25D366;
  font-size:13px;
  padding:10px;
}

/* HIDDEN */
.hidden{display:none;}

/* TOOL */
#tool iframe{
  width:100%;
  height:100vh;
  border:none;
}
</style>
</head>

<body>

<!-- PAYMENT -->
<div id="pay" class="card">

  <h2>Pay to Access</h2>

  <img src="qr.png" style="width:180px;margin:15px 0;">

  <p><b>USDT Wallet:</b></p>

  <div style="display:flex;justify-content:center;gap:6px;font-size:12px;">
    <span id="wallet">YOUR_WALLET_ADDRESS</span>
    <span onclick="copyWallet()" style="cursor:pointer;color:#16a34a;">📋</span>
  </div>

  <p style="margin-top:10px;">Send screenshot via WhatsApp</p>

  <button class="whatsapp" onclick="contact()">Contact WhatsApp</button>

  <p style="margin-top:12px;font-weight:bold;font-size:16px;">
    Only $12/month
  </p>

  <button onclick="showLogin()">Connect to your account</button>

</div>

<!-- LOGIN -->
<div id="login" class="card hidden">

  <h2>Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="error" style="color:red;"></p>

</div>

<!-- TOOL -->
<div id="tool" class="hidden">
  <iframe src="4Docs.html"></iframe>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  setPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* NAV */
window.showLogin = () => {
  document.getElementById("pay").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
};

/* LOGIN */
window.login = () => {
  setPersistence(auth, browserSessionPersistence)
    .then(() => {
      return signInWithEmailAndPassword(auth, email.value, password.value);
    })
    .then(() => {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("tool").classList.remove("hidden");
    })
    .catch(e => error.textContent = e.message);
};

/* LOGOUT */
window.logout = () => {
  signOut(auth).then(()=>location.reload());
};

/* COPY */
window.copyWallet = () => {
  navigator.clipboard.writeText(document.getElementById("wallet").innerText);
  alert("Wallet copied!");
};

/* WHATSAPP */
window.contact = () => {
  window.open("https://wa.me/44XXXXXX");
};

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Tool</title>

<style>

input, select, button {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}
body{margin:0;font-family:Arial;background:#f5f5f5}

/* PAGES */
.page{display:none;height:100vh;justify-content:center;align-items:center}
.active{display:flex}

/* CARD */
.card{
  background:#fff;
  padding:30px;
  border-radius:20px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
}

button{
  padding:12px;
  border:none;
  border-radius:20px;
  background:#16a34a;
  color:white;
  cursor:pointer;
  width:100%;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* TOOL */
#tool iframe{
  width:100%;
  height:100vh;
  border:none;
}
</style>
</head>

<body>

<!-- PAYMENT -->
<div id="pay" class="page active">
  <div class="card">
    <h2>Pay to Access</h2>

    <img src="your-qr.png" style="width:200px">

    <p><b>USDT Wallet:</b></p>
    <p style="font-size:12px">YOUR_WALLET</p>

    <p>Send screenshot to WhatsApp</p>
    <p><b>+44XXXXXX</b></p>

    <p><b>$12 / month</b></p>

    <button onclick="showLogin()">Connect with your account</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="page">
  <div class="card">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <p id="error" style="color:red"></p>
  </div>
</div>

<!-- TOOL -->
<div id="tool">
  <iframe src="4Docs.html"></iframe>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAx4ll0Pb51oWxrroGSk-odIVzBq3zpJI4",
  authDomain: "cashtool-e5fbf.firebaseapp.com",
  projectId: "cashtool-e5fbf",
  appId: "1:453853626540:web:d8bb5eb9bf31b3e2cfdf09"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* NAV */
window.showLogin = () => {
  document.getElementById("pay").style.display = "none";
  document.getElementById("login").style.display = "flex";
};

/* LOGIN */
window.login = () => {

  setPersistence(auth, browserSessionPersistence)
    .then(() => {
      return signInWithEmailAndPassword(auth, email.value, password.value);
    })
    .catch(e => error.textContent = e.message);

};

import { setPersistence, browserSessionPersistence } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

/* AUTH */
onAuthStateChanged(auth, user => {
  if(user){
    tool.style.display="block";
  }
});

/* LOGOUT */
window.logout = () => {
  signOut(auth).then(() => {
    location.reload(); // forces login again
  });
};
</script>

</body>
</html>
